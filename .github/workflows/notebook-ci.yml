name: notebook-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate the notebook structure
        run: |
          python - <<'PY'
          import json

          with open("netflix.ipynb", encoding="utf-8") as handle:
              notebook = json.load(handle)

          cells = notebook["cells"]
          assert len(cells) == 25, f"unexpected cell count: {len(cells)}"
          assert notebook["nbformat"] == 4
          print(f"notebook is valid with {len(cells)} cells")
          PY
